schemaVersion = 1

[[scopes]]
name = "mapgen-domain-test-collections"
root = "plugins/mod/map/*/test/domains"
kind = "directory"
mode = "closed"
allowed = ["+([a-z0-9])*(-+([a-z0-9]))"]

[[scopes]]
name = "mapgen-domain-test-roots"
root = "plugins/mod/map/*/test/domains/+([a-z0-9])*(-+([a-z0-9]))"
kind = "directory"
mode = "closed"
allowed = [
  "*.test.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "mapgen-domain-test-semantic-containers"
root = "plugins/mod/map/*/test/domains/+([a-z0-9])*(-+([a-z0-9]))/*(!(*.*|fixtures)/)!(*.*|fixtures)"
kind = "directory"
mode = "closed"
allowed = [
  "*.test.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "mapgen-domain-test-fixtures"
root = "plugins/mod/map/*/test/domains/+([a-z0-9])*(-+([a-z0-9]))/*(!(*.*)/)fixtures"
kind = "directory"
mode = "closed"
allowed = ["*.ts"]

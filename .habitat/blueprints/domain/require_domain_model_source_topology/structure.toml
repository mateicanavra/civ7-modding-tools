schemaVersion = 1

[[scopes]]
name = "mapgen-domain-root-models"
root = "plugins/mod/map/*/src/domain/!(*.*)/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "atoms",
  "policy",
  "rules",
]

[[scopes]]
name = "mapgen-domain-module-models"
root = "plugins/mod/map/*/src/domain/!(*.*)/modules/!(*.*)/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "atoms",
  "policy",
  "rules",
]

[[scopes]]
name = "mapgen-domain-root-model-rules"
root = "plugins/mod/map/*/src/domain/!(*.*)/model/rules"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "+([a-z0-9])*(-+([a-z0-9])).ts",
]
forbidden = [
  "common.ts",
  "helpers.ts",
  "index.ts",
  "shared.ts",
  "types.ts",
  "utils.ts",
]

[[scopes]]
name = "mapgen-domain-module-model-rules"
root = "plugins/mod/map/*/src/domain/!(*.*)/modules/!(*.*)/model/rules"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "+([a-z0-9])*(-+([a-z0-9])).ts",
]
forbidden = [
  "common.ts",
  "helpers.ts",
  "index.ts",
  "shared.ts",
  "types.ts",
  "utils.ts",
]

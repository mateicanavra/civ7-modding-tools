schemaVersion = 1

[[scopes]]
name = "mapgen-domain-model-roots"
root = "mods/*/src/domain/!(*.*)/model"
kind = "directory"
mode = "closed"
allowed = [
  "schemas",
  "policy",
]

[[scopes]]
name = "mapgen-domain-model-schema-roots"
root = "mods/*/src/domain/!(*.*)/model/schemas"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
]
allowed = [
  "*.schema.ts",
]

[[scopes]]
name = "mapgen-domain-model-policy-roots"
root = "mods/*/src/domain/!(*.*)/model/policy"
kind = "directory"
mode = "closed"
allowed = [
  "*.ts",
]

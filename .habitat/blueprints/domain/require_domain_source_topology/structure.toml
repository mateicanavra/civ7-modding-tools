schemaVersion = 1

[[scopes]]
name = "mapgen-domain-roots"
root = "mods/*/src/domain/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
  "ops.ts",
  "ops",
  "model",
]
allowed = [
  "artifacts",
]

[[scopes]]
name = "mapgen-domain-ops-roots"
root = "mods/*/src/domain/!(*.*)/ops"
kind = "directory"
mode = "closed"
required = [
  "contracts.ts",
  "index.ts",
]
allowed = [
  "!(*.*)",
]

[[scopes]]
name = "mapgen-domain-operation-roots"
root = "mods/*/src/domain/!(*.*)/ops/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "contract.ts",
  "index.ts",
]
allowed = [
  "types.ts",
  "rules",
  "strategies",
  "policy",
]

[[scopes]]
name = "mapgen-domain-model-roots"
root = "mods/*/src/domain/!(*.*)/model"
kind = "directory"
mode = "closed"
allowed = [
  "schemas",
  "policy",
  "data",
]

[[scopes]]
name = "mapgen-domain-model-data-roots"
root = "mods/*/src/domain/!(*.*)/model/data"
kind = "directory"
mode = "closed"
allowed = [
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "mapgen-domain-model-schema-roots"
root = "mods/*/src/domain/!(*.*)/model/schemas"
kind = "directory"
mode = "closed"
required = ["index.ts"]
allowed = ["*.schema.ts"]

[[scopes]]
name = "mapgen-domain-model-policy-roots"
root = "mods/*/src/domain/!(*.*)/model/policy"
kind = "directory"
mode = "closed"
allowed = ["*.ts"]

[[scopes]]
name = "mapgen-domain-model-data-collections"
root = "mods/*/src/domain/!(*.*)/model/data/!(*.*)"
kind = "directory"
mode = "closed"
required = ["index.ts"]
allowed = [
  "*.ts",
]

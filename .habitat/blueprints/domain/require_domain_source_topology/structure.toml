schemaVersion = 1

[[scopes]]
name = "mapgen-domain-roots"
root = "mods/*/src/domain/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
  "contract.ts",
  "router.ts",
  "modules",
]
allowed = [
  "model",
]

[[scopes]]
name = "mapgen-domain-module-containers"
root = "mods/*/src/domain/!(*.*)/modules"
kind = "directory"
mode = "closed"
allowed = [
  "!(*.*)",
]

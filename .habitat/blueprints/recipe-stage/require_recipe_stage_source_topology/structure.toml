schemaVersion = 1

[[scopes]]
name = "recipe-stage-collections"
root = "mods/*/src/recipes/*/stages"
kind = "directory"
mode = "closed"
allowed = ["+([a-z0-9])*(-+([a-z0-9]))"]
forbidden = ["artifacts"]

[[scopes]]
name = "recipe-stage-semantic-containers"
root = "mods/*/src/recipes/*/stages/*(!(*.*|steps|artifacts)/)!(*.*|steps|artifacts)"
kind = "directory"
mode = "closed"
allowed = [
  "+([a-z0-9])*(-+([a-z0-9]))",
  "index.ts",
  "steps",
  "viz.ts",
  "log.ts",
  "public.config.ts",
]
forbidden = ["artifacts"]

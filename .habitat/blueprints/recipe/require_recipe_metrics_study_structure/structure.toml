schemaVersion = 1

[[scopes]]
name = "recipe-metrics-capability-roots"
root = "mods/*/src/recipes/*/metrics"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
  "capture.ts",
  "sample.ts",
  "scenario.ts",
  "families",
  "targets",
  "studies",
]
allowed = ["policy"]

[[scopes]]
name = "recipe-metrics-study-bank-roots"
root = "mods/*/src/recipes/*/metrics/studies"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
  "STUDIES.md",
  "catalog.ts",
  "define.ts",
  "evaluate.ts",
  "model.ts",
  "scenarios.ts",
  "families",
  "benchmarks",
]

[[scopes]]
name = "recipe-metrics-family-modules"
root = "mods/*/src/recipes/*/metrics/families"
kind = "directory"
mode = "closed"
required = [
  "*.ts",
]
allowed = ["+([a-z0-9])*(-+([a-z0-9]))"]

[[scopes]]
name = "recipe-metrics-nested-family-modules"
root = "mods/*/src/recipes/*/metrics/families/+([a-z0-9])*(-+([a-z0-9]))"
kind = "directory"
mode = "closed"
required = ["*.ts"]

[[scopes]]
name = "recipe-metrics-target-modules"
root = "mods/*/src/recipes/*/metrics/targets"
kind = "directory"
mode = "closed"
required = [
  "*.ts",
]

[[scopes]]
name = "recipe-metrics-policy-modules"
root = "mods/*/src/recipes/*/metrics/policy"
kind = "directory"
mode = "closed"
required = ["*.ts"]

[[scopes]]
name = "recipe-metrics-study-family-docs"
root = "mods/*/src/recipes/*/metrics/studies/families"
kind = "directory"
mode = "closed"
required = [
  "*.md",
]

[[scopes]]
name = "recipe-metrics-study-benchmarks"
root = "mods/*/src/recipes/*/metrics/studies/benchmarks"
kind = "directory"
mode = "closed"
required = [
  "*.study.ts",
  "*.md",
]

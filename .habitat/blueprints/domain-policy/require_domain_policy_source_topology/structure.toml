schemaVersion = 1

[[scopes]]
name = "mapgen-domain-root-policy"
root = "plugins/mod/map/*/src/domain/!(*.*)/model/policy"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
]
forbidden = [
  "index.ts",
]

[[scopes]]
name = "mapgen-domain-module-policy"
root = "plugins/mod/map/*/src/domain/!(*.*)/modules/!(*.*)/model/policy"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
]
forbidden = [
  "index.ts",
]

schemaVersion = 1

[[scopes]]
name = "cli-topic-plugin-project-roots"
root = "plugins/cli/topics/*"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "package.json",
  "project.json",
  "src",
  "test",
  "tsconfig.json",
]
allowed = [
  "AGENTS.md",
  "README.md",
  "dist",
  "node_modules",
  "oclif.manifest.json",
  "tsconfig.tsbuildinfo",
]

[[scopes]]
name = "cli-topic-plugin-source-roots"
root = "plugins/cli/topics/*/src"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "commands",
  "index.ts",
]
allowed = ["utils"]

[[scopes]]
name = "cli-topic-plugin-command-collections"
root = "plugins/cli/topics/*/src/commands"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["+([a-z0-9])*(-+([a-z0-9]))"]

[[scopes]]
name = "cli-topic-plugin-command-trees"
root = "plugins/cli/topics/*/src/commands/**/!(*.*)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "cli-topic-plugin-utils"
root = "plugins/cli/topics/*/src/utils"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "cli-topic-plugin-nested-utility-directories"
root = "plugins/cli/topics/*/src/utils/+([a-z0-9])*(-+([a-z0-9]))"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = ["*.ts"]

[[scopes]]
name = "cli-topic-plugin-test-roots"
root = "plugins/cli/topics/*/test"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "commands",
  "tsconfig.json",
]
allowed = [
  "support",
  "utils",
]

[[scopes]]
name = "cli-topic-plugin-command-tests"
root = "plugins/cli/topics/*/test/commands"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["+([a-z0-9])*(-+([a-z0-9]))"]

[[scopes]]
name = "cli-topic-plugin-command-test-trees"
root = "plugins/cli/topics/*/test/commands/**/!(*.*)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.test.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "cli-topic-plugin-util-tests"
root = "plugins/cli/topics/*/test/utils"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = ["*.test.ts"]

[[scopes]]
name = "cli-topic-plugin-test-support"
root = "plugins/cli/topics/*/test/support"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "cli-topic-plugin-nested-test-support"
root = "plugins/cli/topics/*/test/support/**/!(*.*)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]

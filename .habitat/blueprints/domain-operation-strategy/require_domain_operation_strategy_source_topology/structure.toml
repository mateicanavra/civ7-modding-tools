schemaVersion = 1

[[scopes]]
name = "mapgen-domain-operations-require-strategies"
root = "mods/*/src/domain/!(*.*)/modules/!(*.*)/ops/!(*.*)"
kind = "directory"
mode = "open"
required = [
  "strategies",
]

[[scopes]]
name = "mapgen-domain-operation-strategy-roots"
root = "mods/*/src/domain/!(*.*)/modules/!(*.*)/ops/!(*.*)/strategies"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "index.ts",
  "+([a-z0-9])*(-+([a-z0-9]))",
]
forbidden = [
  "default",
]

[[scopes]]
name = "mapgen-domain-operation-strategy-leaves"
root = "mods/*/src/domain/!(*.*)/modules/!(*.*)/ops/!(*.*)/strategies/+([a-z0-9])*(-+([a-z0-9]))"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "config.ts",
  "index.ts",
]

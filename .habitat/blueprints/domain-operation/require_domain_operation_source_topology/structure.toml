schemaVersion = 1

[[scopes]]
name = "mapgen-prohibit-direct-domain-operation-root-sources"
root = "plugins/mod/map/*/src/domain/!(*.*)/ops"
kind = "directory"
mode = "open"
allowEmpty = true
forbidden = [
  "*.ts",
  "*.tsx",
  "*.mts",
  "*.cts",
  "*.js",
  "*.jsx",
  "*.mjs",
  "*.cjs",
]

[[scopes]]
name = "mapgen-prohibit-direct-domain-operation-descendant-sources"
root = "plugins/mod/map/*/src/domain/!(*.*)/ops/**/!(*.*)"
kind = "directory"
mode = "open"
allowEmpty = true
forbidden = [
  "*.ts",
  "*.tsx",
  "*.mts",
  "*.cts",
  "*.js",
  "*.jsx",
  "*.mjs",
  "*.cjs",
]

[[scopes]]
name = "mapgen-domain-module-operation-collections"
root = "plugins/mod/map/*/src/domain/!(*.*)/modules/!(*.*)/ops"
kind = "directory"
mode = "closed"
required = [
  "+([a-z0-9])*(-+([a-z0-9]))",
]

[[scopes]]
name = "mapgen-domain-module-operation-roots"
root = "plugins/mod/map/*/src/domain/!(*.*)/modules/!(*.*)/ops/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "contract.ts",
  "index.ts",
]
allowed = [
  "rules",
  "strategies",
]

schemaVersion = 1

[[scopes]]
name = "mapgen-legacy-domain-operation-collections"
root = "mods/*/src/domain/!(*.*)/ops"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "contract.ts",
  "index.ts",
]
allowed = [
  "!(*.*)",
]

[[scopes]]
name = "mapgen-domain-module-operation-collections"
root = "mods/*/src/domain/!(*.*)/modules/!(*.*)/ops"
kind = "directory"
mode = "closed"
required = [
  "contract.ts",
  "index.ts",
]
allowed = [
  "!(*.*)",
]

[[scopes]]
name = "mapgen-legacy-domain-operation-roots"
root = "mods/*/src/domain/!(*.*)/ops/!(*.*)"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "contract.ts",
  "index.ts",
]
allowed = [
  "types.ts",
  "rules",
  "strategies",
  # Transitional only: unmigrated flat operations still own local policy.
  # Nested module operations intentionally omit this slot; policy moves to the
  # nearest module model during each whole-domain burn-down.
  "policy",
]

[[scopes]]
name = "mapgen-domain-module-operation-roots"
root = "mods/*/src/domain/!(*.*)/modules/!(*.*)/ops/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "contract.ts",
  "index.ts",
]
allowed = [
  "types.ts",
  "rules",
  "strategies",
]

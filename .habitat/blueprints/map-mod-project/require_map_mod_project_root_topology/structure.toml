schemaVersion = 1

[[scopes]]
name = "map-mod-definition-project-roots"
root = "plugins/mod/map/*"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "authoring",
  "package.json",
  "project.json",
  "src",
  "test",
]
allowed = [
  "AGENTS.md",
  "README.md",
  "dist",
  "mod",
  "node_modules",
  "scripts",
  "test",
  "tsconfig.json",
  "tsconfig.test.json",
  "tsconfig.tools.json",
  "tsup.config.ts",
  "vitest.config.ts",
]

[[scopes]]
name = "map-mod-definition-authoring"
root = "plugins/mod/map/*/authoring"
kind = "directory"
mode = "closed"
allowEmpty = false
required = [
  "config.ts",
  "index.ts",
  "targets.ts",
]

[[scopes]]
name = "map-mod-definition-authoring-proof"
root = "plugins/mod/map/*/test/authoring"
kind = "directory"
mode = "closed"
allowEmpty = false
required = [
  "targets.test.ts",
]

[[scopes]]
name = "map-mod-realization-project-roots"
root = "apps/mods/map/*"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "package.json",
  "project.json",
  "src",
]
allowed = [
  "AGENTS.md",
  "README.md",
  "dist",
  "mod",
  "node_modules",
  "scripts",
  "test",
  "tsconfig.json",
  "tsconfig.test.json",
  "tsconfig.tools.json",
  "tsup.config.ts",
  "vitest.config.ts",
]

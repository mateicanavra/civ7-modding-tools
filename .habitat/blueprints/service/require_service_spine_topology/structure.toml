schemaVersion = 1

[[scopes]]
name = "service-projects"
root = "services/!(*.*)"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["package.json", "project.json", "src", "test", "tsconfig.json"]
allowed = [
  "AGENTS.md",
  "dist",
  "node_modules",
  "tsconfig.build.json",
  "tsconfig.test.json",
  "tsconfig.tsbuildinfo",
  "vitest.config.ts",
]

[[scopes]]
name = "service-public-source"
root = "services/!(*.*)/src"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["client.ts", "service"]
allowed = []

[[scopes]]
name = "service-private-spine"
root = "services/!(*.*)/src/service"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["base.ts", "contract.ts", "impl.ts", "modules", "router.ts"]
allowed = ["middleware", "model"]

[[scopes]]
name = "service-module-collection"
root = "services/!(*.*)/src/service/modules"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["[a-z]*([a-z0-9]|-[a-z0-9])"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9])"]

[[scopes]]
name = "service-modules"
root = "services/!(*.*)/src/service/modules/[a-z]*([a-z0-9]|-[a-z0-9])"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["AGENTS.md", "contract", "module.ts", "router", "router.ts"]
allowed = ["middleware", "model"]

[[scopes]]
name = "service-module-contracts"
root = "services/!(*.*)/src/service/modules/[a-z]*([a-z0-9]|-[a-z0-9])/contract"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["index.ts", "!(index).ts"]
allowed = ["index.ts", "[a-z]*([a-z0-9]|-[a-z0-9]).ts"]

[[scopes]]
name = "service-module-routers"
root = "services/!(*.*)/src/service/modules/[a-z]*([a-z0-9]|-[a-z0-9])/router"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["[a-z]*([a-z0-9]|-[a-z0-9]).router.ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).router.ts"]

[[scopes]]
name = "service-root-middleware"
root = "services/!(*.*)/src/service/middleware"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["[a-z]*([a-z0-9]|-[a-z0-9]).ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).ts"]
forbidden = ["index.ts"]

[[scopes]]
name = "service-module-middleware"
root = "services/!(*.*)/src/service/modules/[a-z]*([a-z0-9]|-[a-z0-9])/middleware"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["index.ts", "!(index).ts"]
allowed = ["index.ts", "[a-z]*([a-z0-9]|-[a-z0-9]).ts"]

[[scopes]]
name = "service-root-model"
root = "services/!(*.*)/src/service/model"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["@(actors|dto|errors|policy|ports|prompts)"]
allowed = ["actors", "dto", "errors", "policy", "ports", "prompts"]

[[scopes]]
name = "service-module-model"
root = "services/!(*.*)/src/service/modules/[a-z]*([a-z0-9]|-[a-z0-9])/model"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["@(actors|dto|errors|policy|ports|prompts)"]
allowed = ["actors", "dto", "errors", "policy", "ports", "prompts"]

[[scopes]]
name = "service-root-model-kinds"
root = "services/!(*.*)/src/service/model/@(actors|dto|errors|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["[a-z]*([a-z0-9]|-[a-z0-9]).ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).ts"]
forbidden = ["index.ts"]

[[scopes]]
name = "service-module-model-kinds"
root = "services/!(*.*)/src/service/modules/[a-z]*([a-z0-9]|-[a-z0-9])/model/@(actors|dto|errors|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
required = ["[a-z]*([a-z0-9]|-[a-z0-9]).ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).ts"]
forbidden = ["index.ts"]

[[scopes]]
name = "service-proof-root"
root = "services/!(*.*)/test"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["contract", "execution", "semantics"]
allowed = []

[[scopes]]
name = "service-contract-proof"
root = "services/!(*.*)/test/contract"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["client.typecheck.ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).fixture.ts"]

[[scopes]]
name = "service-semantics-proof"
root = "services/!(*.*)/test/semantics"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["modules"]
allowed = []

[[scopes]]
name = "service-semantics-module-collection"
root = "services/!(*.*)/test/semantics/modules"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["[a-z]*([a-z0-9]|-[a-z0-9])"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9])"]

[[scopes]]
name = "service-semantics-module-proof"
root = "services/!(*.*)/test/semantics/modules/[a-z]*([a-z0-9]|-[a-z0-9])"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["[a-z]*([a-z0-9]|-[a-z0-9]).test.ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).fixture.ts"]

[[scopes]]
name = "service-execution-proof"
root = "services/!(*.*)/test/execution"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["root.test.ts"]
allowed = ["[a-z]*([a-z0-9]|-[a-z0-9]).fixture.ts"]

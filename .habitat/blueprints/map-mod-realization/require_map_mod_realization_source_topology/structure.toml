schemaVersion = 1

[[scopes]]
name = "map-mod-realization-source"
root = "apps/mods/map/*/src"
kind = "directory"
mode = "closed"
allowEmpty = false
required = [
  "build.ts",
  "deploy.ts",
  "runtime",
]
allowed = ["run-manifest.ts"]

[[scopes]]
name = "map-mod-realization-runtime"
root = "apps/mods/map/*/src/runtime"
kind = "directory"
mode = "closed"
allowEmpty = false
required = [
  "adapters",
  "file-plan.ts",
  "map-script",
]
allowed = ["run-manifest.ts"]

[[scopes]]
name = "map-mod-realization-adapters"
root = "apps/mods/map/*/src/runtime/adapters"
kind = "directory"
mode = "closed"
allowEmpty = false
required = ["local-mod-install.ts"]

[[scopes]]
name = "map-mod-realization-map-script"
root = "apps/mods/map/*/src/runtime/map-script"
kind = "directory"
mode = "closed"
allowEmpty = false
required = [
  "compiler.ts",
]

schemaVersion = 1

[[scopes]]
name = "mapgen-domain-root-artifact-collections"
root = "mods/*/src/domain/*/artifacts"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "index.ts",
]
allowed = [
  "*.artifact.ts",
]

[[scopes]]
name = "mapgen-domain-subdomain-artifact-collections"
root = "mods/*/src/domain/*/*/artifacts"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "index.ts",
]
allowed = [
  "*.artifact.ts",
]
